<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5DD3"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6C5DD3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <!-- Person 1 – head -->
  <circle cx="20" cy="17" r="6.5" fill="white" opacity="0.65"/>
  <!-- Person 1 – body -->
  <path d="M7 44 Q7 31 20 31 Q33 31 33 44" fill="white" opacity="0.65"/>

  <!-- Person 2 – head (foreground) -->
  <circle cx="35" cy="15" r="7.5" fill="white"/>
  <!-- Person 2 – body -->
  <path d="M19.5 44 Q19.5 30 35 30 Q50.5 30 50.5 44" fill="white"/>

  <!-- Connection dot -->
  <circle cx="27.5" cy="26" r="2.2" fill="white" opacity="0.55"/>
</svg>
