<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5DD3"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5DD3"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6C5DD3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon Badge -->
  <rect x="0" y="4" width="56" height="56" rx="14" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <!-- Person 1 – head -->
  <circle cx="20" cy="21" r="6.5" fill="white" opacity="0.65"/>
  <!-- Person 1 – body -->
  <path d="M7 48 Q7 35 20 35 Q33 35 33 48" fill="white" opacity="0.65"/>

  <!-- Person 2 – head (foreground) -->
  <circle cx="35" cy="19" r="7.5" fill="white"/>
  <!-- Person 2 – body -->
  <path d="M19.5 48 Q19.5 34 35 34 Q50.5 34 50.5 48" fill="white"/>

  <!-- Tiny connection dot between heads -->
  <circle cx="27.5" cy="30" r="2.2" fill="white" opacity="0.55"/>

  <!-- HRMS text -->
  <text
    x="70"
    y="35"
    font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
    font-weight="800"
    font-size="28"
    fill="url(#textGrad)"
    letter-spacing="-0.5"
  >HRMS</text>

  <!-- Subtitle -->
  <text
    x="71"
    y="52"
    font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
    font-weight="500"
    font-size="10"
    fill="#9E9E9E"
    letter-spacing="2.2"
  >MANAGEMENT SYSTEM</text>

  <!-- Accent underline under HRMS -->
  <rect x="70" y="38.5" width="100" height="2" rx="1" fill="url(#textGrad)" opacity="0.25"/>
</svg>
